<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Recommendation decision matrix: interests 50 percent, mission evidence 30 percent, learning-environment affinity 20 percent">
  <defs>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5EF6"/>
      <stop offset="48%" stop-color="#C13BF0"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D5EF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6D5EF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="barClip"><rect x="80" y="112" width="1040" height="46" rx="10"/></clipPath>
    <clipPath id="cardClip"><rect x="0" y="0" width="1200" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="300" fill="#0B0B14"/>
    <ellipse cx="140" cy="20" rx="420" ry="220" fill="url(#g2)"/>

    <text x="80" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F5F5FA">Recommendation decision matrix</text>
    <text x="80" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A0A0B8">Three evidence-derived criteria, each scored 0–100, combined into one weighted composite score</text>

    <g clip-path="url(#barClip)">
      <rect x="80"  y="112" width="520" height="46" fill="#6D5EF6"/>
      <rect x="600" y="112" width="312" height="46" fill="#C13BF0"/>
      <rect x="912" y="112" width="208" height="46" fill="#4FD7C4"/>
      <g stroke="#0B0B14" stroke-width="2">
        <line x1="600" y1="112" x2="600" y2="158"/>
        <line x1="912" y1="112" x2="912" y2="158"/>
      </g>
    </g>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F5FA" text-anchor="middle">
      <text x="340" y="142">50%</text>
      <text x="756" y="142">30%</text>
      <text x="1016" y="142" fill="#0B0B14">20%</text>
    </g>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <g transform="translate(80,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#6D5EF6"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Interests</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">RIASEC profile</text>
      </g>
      <g transform="translate(430,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#C13BF0"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Mission evidence</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">Completed scenario signal</text>
      </g>
      <g transform="translate(780,196)">
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#4FD7C4"/>
        <text x="16" y="14" font-size="14" font-weight="700" fill="#F5F5FA">Learning environment</text>
        <text x="16" y="31" font-size="12.5" fill="#A0A0B8">Profile affinity with route</text>
      </g>
    </g>

    <text x="80" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFD27A">Unverified cost, relocation, timing, and flexibility stay visible as prompts but do not affect the score.</text>
    <text x="80" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B879E">Fixed in lib/decision-engine/scoring.ts · design judgement · not fitted to student outcomes</text>
    <rect x="0" y="296" width="1200" height="4" fill="url(#aurora2)"/>
  </g>
</svg>
